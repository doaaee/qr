<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenLoop | Stand Feria de las Ideas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --teal-600: #00897B;
            --teal-500: #009688;
            --teal-100: #E0F2F1;
            --dark-grey: #1F2937;
            --accent-orange: #FF7043;
            --white: #FFFFFF;
        }

        body {
            background-color: white; /* Optimizado para impresión */
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark-grey);
        }

        .main-card {
            background: var(--white);
            padding: 60px 40px;
            border-radius: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 4px solid var(--teal-600); /* Borde fuerte para que destaque al cortarlo */
            position: relative;
        }

        .sticker-badge {
            position: absolute;
            top: -25px;
            right: -15px;
            background: var(--accent-orange);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            font-family: 'Outfit';
            font-weight: 900;
            font-size: 20px;
            transform: rotate(10deg);
            box-shadow: 5px 5px 0px var(--dark-grey);
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .logo-section i {
            font-size: 40px;
            color: var(--teal-600);
        }

        .logo-section h1 {
            font-family: 'Outfit';
            font-size: 45px;
            margin: 0;
            color: var(--teal-600);
            letter-spacing: -2px;
        }

        .call-to-action {
            font-family: 'Outfit';
            font-size: 32px;
            line-height: 1.1;
            font-weight: 900;
            color: var(--dark-grey);
            margin-bottom: 15px;
        }

        .call-to-action span {
            color: var(--teal-500);
            text-decoration: underline;
        }

        .sub-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--teal-600);
            margin-bottom: 35px;
            background: var(--teal-100);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 12px;
        }

        .qr-wrapper {
            background: var(--white);
            padding: 20px;
            border-radius: 30px;
            display: inline-block;
            border: 5px dashed var(--teal-600);
            margin-bottom: 20px;
        }

        .qr-container img {
            display: block;
            width: 250px; 
            height: 250px;
            border-radius: 10px;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #64748B;
        }

        @media print {
            .sticker-badge { -webkit-print-color-adjust: exact; }
            .main-card { border: 4px solid #00897B !important; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="sticker-badge">🎁 ¡FREEBIES!</div>
        
        <div class="logo-section">
            <i class="fa-solid fa-leaf"></i>
            <h1>GreenLoop</h1>
        </div>

        <div class="call-to-action">
            Pruébalo en directo y 
            llévate tu <span>Regalo</span>
        </div>
        
        <div class="sub-text">
            ¡Haciendo la sostenibilidad irresistible! ✨
        </div>

        <div class="qr-wrapper">
            <div class="qr-container">
                <img src="qr_code.png" alt="QR Demo App">
            </div>
        </div>

        <div class="footer-note">📍Feria de las Ideas – ven a vernos</div>
    </div>

</body>
</html>
