<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenLoop | Stand Feria de las Ideas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --teal-600: #00897B;
            --teal-500: #009688;
            --teal-100: #E0F2F1;
            --dark-grey: #1F2937;
            --accent-orange: #FF7043;
            --white: #FFFFFF;
        }

        body {
            background-color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark-grey);
        }

        .main-card {
            background: var(--white);
            padding: 50px 40px;
            border-radius: 40px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            border: 4px solid var(--teal-600);
            position: relative;
        }

        /* 6️⃣ FREEBIES STICKER: 15% smaller and better tilt */
        .sticker-badge {
            position: absolute;
            top: -15px; 
            right: -5px;
            background: var(--accent-orange);
            color: white;
            padding: 10px 18px; 
            border-radius: 12px;
            font-family: 'Outfit';
            font-weight: 900;
            font-size: 17px; 
            transform: rotate(6deg); 
            box-shadow: 4px 4px 0px var(--dark-grey);
            z-index: 10;
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo-section i {
            font-size: 40px;
            color: var(--teal-600);
        }

        .logo-section h1 {
            font-family: 'Outfit';
            font-size: 45px;
            margin: 0;
            color: var(--teal-600);
            letter-spacing: -2px;
        }

        /* 2️⃣ TEXT BREAK FIX: Everything in one line */
        .call-to-action {
            font-family: 'Outfit';
            font-size: 25px; 
            white-space: nowrap;
            font-weight: 900;
            color: var(--dark-grey);
            margin-bottom: 15px;
        }

        .call-to-action span {
            color: var(--teal-500);
            text-decoration: underline;
        }

        .sub-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--teal-600);
            margin-bottom: 30px;
            background: var(--teal-100);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 12px;
        }

        /* 3️⃣ QR BIGGER & PUSH TEXT */
        .qr-wrapper {
            background: var(--white);
            padding: 15px;
            border-radius: 30px;
            display: inline-block;
            border: 5px dashed var(--teal-600);
            margin-bottom: 10px;
        }

        .qr-container img {
            display: block;
            width: 280px; 
            height: 280px;
            border-radius: 10px;
        }

        .qr-push-text {
            display: block;
            font-family: 'Outfit';
            font-weight: 800;
            font-size: 18px;
            color: var(--teal-600);
            margin-top: 5px;
            margin-bottom: 25px;
        }

        /* 4️⃣ LOCATION FIX: Specific and bold */
        .footer-note {
            margin-top: 10px;
            font-size: 20px;
            font-weight: 800;
            font-family: 'Outfit';
            color: var(--dark-grey);
            border-top: 2px solid var(--teal-100);
            padding-top: 20px;
        }

        @media print {
            .sticker-badge { -webkit-print-color-adjust: exact; }
            .main-card { border: 4px solid #00897B !important; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="sticker-badge">🎁 ¡FREEBIES!</div>
        
        <div class="logo-section">
            <i class="fa-solid fa-leaf"></i>
            <h1>GreenLoop</h1>
        </div>

        <div class="call-to-action">
            Pruébalo en directo y llévate tu <span>Regalo</span>
        </div>
        
        <div class="sub-text">
            ¡Haciendo la sostenibilidad irresistible! ✨
        </div>

        <div class="qr-wrapper">
            <div class="qr-container">
                <img src="qr_code.png" alt="QR Demo App">
            </div>
        </div>
        
        <div class="qr-push-text">
            💣 Escanea y empieza en segundos
        </div>

        <div class="footer-note">
            📍 Búscanos en la feria
        </div>
    </div>

</body>
</html>
