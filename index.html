<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenLoop Sticker - Round Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --brand-teal: #0d9488;
            --dark-teal: #0f766e; 
            --white: #FFFFFF;
            --bg-page: #f1f5f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-page);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .sticker-circle {
            background-color: var(--brand-teal);
            width: 450px;
            height: 450px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(13, 148, 136, 0.3);
            border: 12px solid var(--white); /* Slightly thicker border for better "die-cut" look */
            overflow: hidden;
        }

        /* Leaf Icon */
        .icon-container {
            color: var(--white);
            font-size: 110px; /* Scaled down slightly to fit QR better */
            margin-bottom: 0px;
            z-index: 2;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        /* GreenLoop Text */
        .brand-name {
            color: var(--white);
            font-size: 72px;
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 1;
            z-index: 2;
        }

        /* UAL SOSTENIBLE - Larger and bolder */
        .tagline {
            color: var(--white);
            font-size: 20px; /* Increased from 16px */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px; /* Slightly tighter spacing for readability */
            margin-top: 12px;
            background: var(--dark-teal);
            padding: 8px 20px;
            border-radius: 50px;
            z-index: 2;
        }

        /* QR Code Container */
        .qr-container {
            margin-top: 20px;
            z-index: 2;
            background: var(--white);
            padding: 5px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-container img {
            width: 50px; /* Small but scan-able */
            height: 50px;
            display: block;
        }

        /* Vinyl Shine Effect */
        .vinyl-shine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%);
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="sticker-circle">
        <div class="vinyl-shine"></div>
        
        <div class="icon-container">
            <i class="fa-solid fa-leaf"></i>
        </div>
        
        <h1 class="brand-name">GreenLoop</h1>
        
        <p class="tagline">UAL Sostenible</p>

        <div class="qr-container">
            <img src="qr_code.png" alt="QR Code">
        </div>
    </div>

</body>
</html>
